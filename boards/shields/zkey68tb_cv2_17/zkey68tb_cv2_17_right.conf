CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_POINTING=y
CONFIG_PAW3222=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

CONFIG_ZMK_KEYBOARD_NAME="ZKey68tb"

# Trackball動作改善
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_BLE_EXPERIMENTAL_SEC=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Transmission Power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 2026/05/18 Added
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=2048
CONFIG_ZMK_BLE_THREAD_PRIORITY=5
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Prospector Scanner - BLE Status Advertisement
#CONFIG_ZMK_STATUS_ADVERTISEMENT=y
#CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="ZKey68tb"
#CONFIG_ZMK_STATUS_ADV_ACTIVITY_BASED=y
#CONFIG_ZMK_STATUS_ADV_ACTIVE_INTERVAL_MS=1000
#CONFIG_ZMK_STATUS_ADV_IDLE_INTERVAL_MS=30000
#CONFIG_ZMK_STATUS_ADV_ACTIVITY_TIMEOUT_MS=5000

# Split Keyboard Battery
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
