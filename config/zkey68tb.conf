# Pointing Device (Mouse Keys)
CONFIG_ZMK_POINTING=y

CONFIG_ZMK_KEYBOARD_NAME="ZKey68tb"

# Prospector Settings
# ===== REQUIRED =====
CONFIG_ZMK_STATUS_ADVERTISEMENT=y
CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="ZKey68tb"

# ===== POWER OPTIMIZATION (all have sensible defaults) =====
CONFIG_ZMK_STATUS_ADV_ACTIVITY_BASED=y
CONFIG_ZMK_STATUS_ADV_ACTIVE_INTERVAL_MS=100
CONFIG_ZMK_STATUS_ADV_IDLE_INTERVAL_MS=10000
CONFIG_ZMK_STATUS_ADV_ACTIVITY_TIMEOUT_MS=120000

# ===== SPLIT KEYBOARD =====
#CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y  # Fetch peripheral battery
CONFIG_ZMK_STATUS_ADV_CENTRAL_SIDE="RIGHT"

# ===== WPM TRACKING =====
CONFIG_ZMK_STATUS_ADV_WPM_WINDOW_SECONDS=30       # WPM calculation window (5-120s)

# 複数の周辺機器を接続した構成
CONFIG_PROSPECTOR_EXPECTED_PERIPHERAL_COUNT=2
